<main>
<div class="card">
<h1>昼休みに、図書室を開けてほしい？</h1>
<p class="lead">答えを2つに分け、担当AとBに送ります。このデモは架空の回答専用です。両方のシェアを集められるため、実際の回答を秘密にする保証はありません。</p>
<div class="choices"><button class="choice yes" id="yes">開けてほしい</button><button class="choice no" id="no">今のままでよい</button></div>
<p class="status" id="status" aria-live="polite"></p>
<div class="pair"><div class="vault"><h3>担当Aに送った数字</h3><span id="shareA">（まだ送っていません）</span></div><div class="vault"><h3>担当Bに送った数字</h3><span id="shareB">（まだ送っていません）</span></div></div>
<p class="note">各担当は、受け取ったシェアと回答が０か１である証明を検証します。方式は実験段階です。両方のシェアを合わせれば回答が分かります。</p>
</div>
</main></body></html>
