name: Verify and deploy Sumi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumi-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sumi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Lean version manager
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if timeout 60s gh release download v4.2.4 --repo leanprover/elan --pattern elan-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned JavaScript dependencies
        run: npm ci
      - name: Install pinned Lean toolchain
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 180s elan toolchain install "$(cat formal/lean-toolchain)"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Test document processing and authorization
        run: npm test
      - name: Verify Lean model and build
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sumi/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
