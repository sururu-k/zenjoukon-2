name: Verify and deploy Sumi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumi-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sumi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Lean version manager
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if timeout 60s gh release download v4.2.4 --repo leanprover/elan --pattern elan-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned JavaScript dependencies
        run: npm ci
      - name: Install pinned Lean toolchain
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2; do
            if timeout 90s elan toolchain install "$(cat formal/lean-toolchain)"; then
              exit 0
            fi
            sleep 10
          done
          # Fall back to the same official GitHub release if the mirror fails.
          test "$(cat formal/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          timeout 300s gh release download v4.34.1 --repo leanprover/lean4 --pattern lean-4.34.1-linux.tar.zst --dir "$RUNNER_TEMP" --clobber
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/lean-4.34.1-linux.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean-4.34.1-linux.tar.zst" -C "$RUNNER_TEMP"
          elan toolchain link 'leanprover/lean4:v4.34.1' "$RUNNER_TEMP/lean-4.34.1-linux"
          elan run 'leanprover/lean4:v4.34.1' lean --version
      - name: Test document processing and authorization
        run: npm test
      - name: Verify Lean model and build
        run: npm run build
      - name: Install pinned Noir compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --repo noir-lang/noir --pattern noir-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP" --clobber
          echo "a62f5b44a6db8ca8f0c20f841aa788ea56776e5aaf2ebd672c02dcf397901264  $RUNNER_TEMP/noir-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/noir"
          tar -xzf "$RUNNER_TEMP/noir-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/noir"
          "$RUNNER_TEMP/noir/nargo" --version
      - name: Build browser document proof
        working-directory: sumi/experiments/browser-document-proof
        env:
          SUMI_NARGO: ${{ runner.temp }}/noir/nargo
        run: |
          npm ci
          npm run build -- ../../dist/document-proof
      - name: Verify shared school policy workflow
        env:
          SUMI_NARGO: ${{ runner.temp }}/noir/nargo
          SUMI_BB: ${{ github.workspace }}/sumi/experiments/browser-document-proof/node_modules/@aztec-foundation/bb.js/build/amd64-linux/bb
        run: node scripts/shared-policy-demo.mjs
      - name: Test browser document proof
        working-directory: sumi/experiments/browser-document-proof
        env:
          SUMI_NARGO: ${{ runner.temp }}/noir/nargo
        run: |
          npx playwright install --with-deps chromium
          npm test
          npm run test:ui
      - name: Check and include Lean visualizations
        run: |
          node scripts/check-lean-visualization.mjs
          mkdir -p dist/lean
          cp -R visualization/lean/. dist/lean/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sumi/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
